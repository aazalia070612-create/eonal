<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONAL Admin</title><style>body{margin:0;background:#080608;color:#fff;font:15px Arial;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:50px 20px}h1{font-size:48px}.box{border:1px solid #2a171c;border-radius:14px;padding:24px;margin:18px 0;background:#100a0d}input,button{padding:12px;border-radius:8px;border:1px solid #382027;background:#0d080b;color:#fff;margin:5px 0}button{background:#ff1838;color:#180307;font-weight:800;cursor:pointer}.hidden{display:none}.row{display:grid;gap:8px;margin:12px 0}#status{color:#ff4961}</style></head><body><div class="wrap"><h1>EONAL <span style="color:#ff1838">ADMIN</span></h1><p>Private upload dashboard.</p><div id="login" class="box"><h2>Login</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">LOGIN</button></div></div><div id="panel" class="hidden"><div class="box"><h2>Add video</h2><input id="videoTitle" placeholder="Video title"><input id="videoFile" type="file" accept="video/*"><button id="uploadVideo">UPLOAD VIDEO</button></div><div class="box"><h2>Add preset</h2><input id="presetTitle" placeholder="Preset name"><input id="presetFile" type="file"><input id="presetImage" type="file" accept="image/*"><button id="uploadPreset">UPLOAD PRESET</button></div><button id="logout">LOG OUT</button></div><p id="status"></p></div><script src="../admin/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(window.EONAL_SUPABASE_URL,window.EONAL_SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);async function refresh(){const {data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!session);$('panel').classList.toggle('hidden',!session)}$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('status').textContent=error?error.message:'Logged in';refresh()};$('logout').onclick=async()=>{await sb.auth.signOut();refresh()};$('uploadVideo').onclick=async()=>{const f=$('videoFile').files[0];if(!f)return;const path='videos/'+crypto.randomUUID()+'-'+f.name;let r=await sb.storage.from('eonal-media').upload(path,f);if(r.error){$('status').textContent=r.error.message;return}r=await sb.from('videos').insert({title:$('videoTitle').value||f.name,file_path:path});$('status').textContent=r.error?r.error.message:'Video uploaded';};$('uploadPreset').onclick=async()=>{const f=$('presetFile').files[0],img=$('presetImage').files[0];if(!f)return;const path='presets/'+crypto.randomUUID()+'-'+f.name;let r=await sb.storage.from('eonal-media').upload(path,f);if(r.error){$('status').textContent=r.error.message;return}let image_path=null;if(img){image_path='preset-images/'+crypto.randomUUID()+'-'+img.name;r=await sb.storage.from('eonal-media').upload(image_path,img);if(r.error){$('status').textContent=r.error.message;return}}r=await sb.from('presets').insert({title:$('presetTitle').value||f.name,file_path:path,image_path});$('status').textContent=r.error?r.error.message:'Preset uploaded'};refresh();</script></body></html>
